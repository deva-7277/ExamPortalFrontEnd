<mat-card *ngIf="user">
  <mat-action-list>
    <button mat-list-item [routerLink]="'/profile'">
      <mat-icon mat-list-icon class="st">person</mat-icon> {{ user.username }} Profile
    </button>      
    <div mat-subheader>Available Categories</div>
    <button mat-list-item routerLink="/user-dashboard/0">
      <mat-icon mat-list-icon class="st">quiz</mat-icon> All Quizzes
    </button>
    <button
      [routerLink]="'/user-dashboard/' + c.cid"
      mat-list-item
      *ngFor="let c of categories"
    >
      <mat-icon mat-list-icon class="st">quiz</mat-icon> {{ c.title }}
    </button>
  </mat-action-list>
</mat-card>
