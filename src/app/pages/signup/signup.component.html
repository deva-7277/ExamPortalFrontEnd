<div class="container text-center">
    <img src="../../../assets/logo.png" height = "100px" width = "100px" alt ="Logo image" />
</div>
<h1 class = "text-center">
    Register
</h1>
<!-- signup.component.html -->
<form (ngSubmit)="onSubmit(signupForm)" #signupForm="ngForm" enctype="multipart/form-data">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" class="form-control" id="username" name="username" ngModel required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" class="form-control" id="password" name="password" ngModel required>
    </div>
    <div class="form-group">
      <label for="firstName">First Name</label>
      <input type="text" class="form-control" id="firstName" name="firstName" ngModel required>
    </div>
    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input type="text" class="form-control" id="lastName" name="lastName" ngModel required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" class="form-control" id="email" name="email" ngModel required>
    </div>
    <div class="form-group">
      <label for="phone">Phone</label>
      <input type="tel" class="form-control" id="phone" name="phone" ngModel required>
    </div>
    <div class="form-group">
        <label for="imageFile">Image</label>
        <input type="file" class="form-control-file" id="imageFile" name="imageFile" (change)="onFileSelected($event)" required>
      </div>
      <div class="image-preview" *ngIf="imageUrl">
        <img [src]="imageUrl" alt="Image Preview">
        <button type="button" class="btn btn-link" (click)="clearImage()">Remove Image</button>
      </div>
    <button type="submit" class="btn btn-primary">Register</button>
  </form>
